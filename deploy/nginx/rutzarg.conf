# nginx reverse proxy for Rutzarg (game server from docker-compose on 127.0.0.1:8787).
# Install:
#   sudo cp deploy/nginx/rutzarg.conf /etc/nginx/sites-available/rutzarg.conf
#   sudo sed -i 's/rutzarg.example.com/<твій-домен>/g' /etc/nginx/sites-available/rutzarg.conf
#   sudo ln -s /etc/nginx/sites-available/rutzarg.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d <твій-домен>        # TLS certificate (Let's Encrypt)
#   sudo nginx -t && sudo systemctl reload nginx

# WebSocket upgrade helper (http context — files in sites-enabled are included there)
map $http_upgrade $rutzarg_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream rutzarg_game {
    server 127.0.0.1:8787;
    keepalive 16;
}

# Brute-force protection for sign-in endpoints (the game also limits per IP)
limit_req_zone $binary_remote_addr zone=rutzarg_auth:10m rate=10r/m;

# HTTP → HTTPS (and the ACME challenge for certbot)
server {
    listen 80;
    listen [::]:80;
    server_name rutzarg.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rutzarg.example.com;

    # Paths created by certbot (adjust if your certificates live elsewhere)
    ssl_certificate     /etc/letsencrypt/live/rutzarg.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rutzarg.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 64k;

    # the client bundle is ~1.2 MB of JS — compress it
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    # NOTE: any proxy_set_header inside a location drops ALL the ones from this level,
    # so every location below repeats the forwarding headers (client IP for rate limits and
    # the game's "is this request local?" checks, Host/proto for sign-in redirects).

    # Game WebSocket: long-lived connection
    location = /ws {
        proxy_pass http://rutzarg_game;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $rutzarg_connection_upgrade;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering off;
    }

    # Sign-in / registration (rate limited)
    location ~ ^/(api/auth/(login|register)|api/editor/login|auth/google) {
        limit_req zone=rutzarg_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://rutzarg_game;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Item editor: saving game data sends more than the 64k limit above allows as the data grows
    location = /api/gamedata {
        client_max_body_size 2m;
        proxy_pass http://rutzarg_game;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Everything else: the client (HTML/JS/CSS), /api/*, /health
    location / {
        proxy_pass http://rutzarg_game;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
